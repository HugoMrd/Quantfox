version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantfox
      POSTGRES_USER: quantfox
      POSTGRES_PASSWORD: quantfox
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantfox -d quantfox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  python-api:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - CONFIG_PATH=/app/config.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./python-api/config.toml:/app/config.toml:ro

  celery-worker:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - CONFIG_PATH=/app/config.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./python-api/config.toml:/app/config.toml:ro

  rust-api:
    build:
      context: ./rust-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CONFIG_PATH=/app/config.toml
    depends_on:
      - python-api
    volumes:
      - ./rust-api/config.toml:/app/config.toml:ro

volumes:
  postgres_data:
